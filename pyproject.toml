[project]
name = "pyproject-reputation-analysis"
version = "0.1.0"
requires-python = ">=3.10"
description = "Reputation analysis demo (news/reddit/analyst insights + stock prices + forecasting)"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "github_demo",
]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B",
]
ignore = [
  "E501", # line length handled by formatter preferences
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

